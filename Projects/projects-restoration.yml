
- title: Restoration physiology
  image: media/restor-post.png
  description: |
    <br>
     Stream restoration is widely used to improve degraded aquatic ecosystems and support the recovery of biodiversity and ecosystem function. We examine how fish respond to restoration efforts in Baltimore County streams, with a particular focus on physiological performance and habitat use. By combining traditional field-based ecological assessments with physiological measurements and habitat modeling, we aim to better understand how restoration influences fish health, performance, and distribution. 
