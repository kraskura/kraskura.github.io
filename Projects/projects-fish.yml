
- title: Environmental tolerance of striped bass across lifestages 
  image: media/juv-striped-post.png
  image-alt: striped bass pictures
  description: |
    <br>
    We are exploring environmental tolerance in early life striped bass. As fish grow and mature, they may shift habitats, encounter new environmental stressors, and reallocate energy from growth toward reproduction. Our current projects explore both acute and acclimation responses in striped bass embryos, larvae, and juveniles as they face a range of environmental challenges (e.g., temperatures, hypoxia). Through this work, we aim to better understand the physiological mechanisms that drive vulnerability and resilience of fish in dynamic ecosystems. 
