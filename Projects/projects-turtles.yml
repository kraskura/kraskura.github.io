
- title: Locomotion in freshwater turtles
  image: media/turtle-post.jpg
  image-alt: turtle hsatchling
  description: |
    <br>
    Over half of freshwater turtle species face extinction risks. Hatchlings are the most vulnerable - They are tiny, extremely prone to predation, and generally have very low survival rates. We are measuring locomotive performance as part of a larger interdisciplinary project with TU colleagues Drs. Steve Kimble, Xin Huang, and Ryan Casey. 