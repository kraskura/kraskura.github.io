
- title: Tadpole performance in salty conditions 
  image: media/peeper-post.jpg
  description: |
    <br> Road de-icing salt runoff is raising baseline salinity levels in freshwater environments, including ephemeral ponds, where many amphibians reproduce and develop. Our projects examine how tadpoles of common frog species across northeastern America cope with these changing conditions. We are combining organismal performances with transcriptomic analyses to understand the biological impacts of freshwater salinization on tadpoles and identify the mechanisms that enable resilience or contribute to sensitivity. This is team work with Drs Jacqueline Doyle (TU) and Will Ryan (Dartmouth College).
    
