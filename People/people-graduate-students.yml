
- title: "Yvette Gaytan"
  image: media/yvette-gaytan.jpg
  subtitle: Master's Student
  description: "'I love fish! I am especially interested in temperature tolerance, blood physiology and blood cell morphology, and how climate change affects fish's performance curves. Outside of research, I dabble in many hobbies including weightlifting, video gaming, and playing guitar.'"

- title: "Abi Millholland"
  image: media/abi-millholland.jpeg
  subtitle: |
    Master's Student. Co-mentored with Dr. Will Ryan and Dr. Jackie Doyle
  description: "'I am broadly interested in the effects of environmental change on populations and their ecological roles. Specifically, I am interested in how genetic connectivity, adaptation, and phenotypic plasticity influence a species' ability to adjust to the changing environment. I enjoy hiking, fishing, herping, and being outside in any capacity! I also enjoy playing the guitar when I can.'"

- title: "Brianna Hutchins"
  image: media/brianna-hutchins.jpg
  subtitle: Master's Student in Dr. Salice Lab. We collaborate on Striped Bass project. 
  description: "'I am excited to learn about how various fish species are impacted by different factors such as increased temperatures and emergent contaminants such as algal toxins. As climate continues to change in the Chesapeake Bay Watershed, monitoring the effects on local fish populations such as striped bass will be important! In my free time, I love to bake and hike. My goal is to eventually hit all of the state parks in Maryland!'"

- title: "Adeline McCullough"
  image: media/ade-mccullough.jpg
  subtitle: Research Assistant.
  description: "'I recently finished my master's of science in marine biology, where I researched Atlantic Blue Crab habitat use and movement ecology. In the Kraskura Lab I am excited to broaden my knowledge of animal physiology, and I am especially interested in the effects of human-made environmental pollutants on aquatic organisms. In my free time I like to do yoga, crochet, and spend time with my cat Stella. '"

- title: "Faith Matthews"
  image: media/faith-matthews.jpg
  subtitle: Undergraduate Student. Co-mentored with Dr. Christopher Salice
  description: "'I explore the ecological impacts of freshwater salinization in Maryland, specifically how salinity affects sex-specific metabolic performance in the native Common crayfish and the invasive Virile crayfish. My goals are to uncover the physiological mechanisms behind the success of invasive species and to contribute insights that inform future conservation and resource management strategies. More broadly, I am passionate about watershed ecology, conservation, and sustainability. I enjoy gardening, drawing and painting, and exploring the outdoors—activities that deepen my appreciation for the natural systems I study!'"

- title: "Zoe Worthy"
  image: media/zoe-worthy.jpg
  subtitle: Undergraduate Student. 
  description: "'I'm most excited to learn about human impact on our water systems. I think in the media there is a lot of focus on terrestrial life and too much of general outlook on aquatic systems. This lab does just that with a focus on what we have in our own backyard. I like to dance and my favorite kind of day is a full day at the beach!'"

