  description: "'I’m most excited to learn about human impact on our water systems. I think in the media there is a lot of focus on terrestrial life and too much of general outlook on aquatic systems. This lab does just that with a focus on what we have in our own backyard. I like to dance and my favorite kind of day is a full day at the beach!'"

